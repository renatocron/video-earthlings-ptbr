<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Terráqueos 101</title>
<style>
  :root {
    --bg: #0b0d12;
    --card: #171b24;
    --card-hi: #232a38;
    --fg: #eef1f6;
    --muted: #8d97a8;
    --accent: #6fd0ff;
    --done: #7ddc8a;
    --u: clamp(12px, 1.6vw, 28px);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
    font: 400 var(--u)/1.35 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  button:focus { outline: none; }

  #home { padding: calc(var(--u) * 2) calc(var(--u) * 3); min-height: 100%; }
  #home h1 { margin: 0 0 calc(var(--u) * 1.2); font-size: calc(var(--u) * 2); letter-spacing: .02em; }
  #home h1 small { color: var(--muted); font-size: .5em; font-weight: 400; margin-left: .6em; }
  #grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--u); }
  .card { text-align: left; background: var(--card); border-radius: calc(var(--u) * .6);
    padding: var(--u); min-height: calc(var(--u) * 6.5); position: relative; overflow: hidden;
    border: 3px solid transparent; transition: transform .12s, background .12s; }
  .card:focus { background: var(--card-hi); border-color: var(--accent); transform: scale(1.04); }
  .card .n { color: var(--accent); font-weight: 700; font-size: .85em; }
  .card .t { display: block; margin-top: .3em; }
  .card .bar { position: absolute; left: 0; bottom: 0; height: 5px; background: var(--accent); }
  .card.done .n::after { content: "  ✓ visto"; color: var(--done); }
  .card.done .bar { background: var(--done); }

  #player { position: fixed; inset: 0; background: #000; display: none; }
  #player.on { display: block; }
  body.playing { overflow: hidden; }
  video { width: 100%; height: 100%; object-fit: contain; background: #000; }
  video::cue { font-size: calc(var(--u) * 1.5); background: rgba(0,0,0,.7); }

  #osd { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: space-between;
    background: linear-gradient(rgba(0,0,0,.75), transparent 22%, transparent 60%, rgba(0,0,0,.85));
    transition: opacity .25s; }
  #player.idle #osd { opacity: 0; pointer-events: none; }
  #player.idle { cursor: none; }
  #top { padding: calc(var(--u) * 1.2) calc(var(--u) * 2); font-size: calc(var(--u) * 1.2); }
  #top .n { color: var(--accent); margin-right: .5em; }
  #bottom { padding: 0 calc(var(--u) * 2) calc(var(--u) * 1.4); }
  #seek { display: flex; align-items: center; gap: var(--u); margin-bottom: var(--u); font-variant-numeric: tabular-nums; }
  #track { flex: 1; height: 28px; background: rgba(255,255,255,.25); border-radius: 4px; position: relative;
    cursor: pointer; touch-action: none; background-clip: content-box; padding: 10px 0; }
  #track:hover { height: 28px; padding: 8px 0; }
  #track:hover #fill { inset: 8px auto 8px 0; }
  #fill { position: absolute; inset: 10px auto 10px 0; background: var(--accent); border-radius: 4px; pointer-events: none; }
  #ctrls { display: flex; gap: calc(var(--u) * .4); align-items: center; font-size: .85em; }
  #ctrls .sep { flex: 1; max-width: var(--u); }
  .b { padding: .45em .8em; border-radius: .5em; background: rgba(255,255,255,.1);
    border: 3px solid transparent; white-space: nowrap; }
  .b:focus { border-color: var(--accent); background: rgba(111,208,255,.22); }
  .b.sel { background: var(--accent); color: #001a26; font-weight: 700; }
  #toast { position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%);
    background: rgba(0,0,0,.7); padding: .4em 1em; border-radius: .5em; font-size: calc(var(--u) * 1.6);
    opacity: 0; transition: opacity .3s; pointer-events: none; }
  #toast.show { opacity: 1; }

  @media (max-width: 900px) { #grid { grid-template-columns: repeat(2, 1fr); } }
</style>
</head>
<body>
<main id="home">
  <h1>Terráqueos 101 <small>dublado em pt-br</small></h1>
  <div id="grid"></div>
</main>

<section id="player">
  <video id="v" playsinline preload="metadata"></video>
  <div id="toast"></div>
  <div id="osd">
    <div id="top"><span class="n" id="pn"></span><span id="pt"></span></div>
    <div id="bottom">
      <div id="seek"><span id="cur">0:00</span><div id="track"><div id="fill"></div></div><span id="dur">0:00</span></div>
      <div id="ctrls">
        <button class="b" data-act="back10">« 10s</button>
        <button class="b" data-act="play" id="playBtn">⏸ Pausar</button>
        <button class="b" data-act="fwd10">10s »</button>
        <span class="sep"></span>
        <button class="b" data-rate="1">1x</button>
        <button class="b" data-rate="1.25">1.25x</button>
        <button class="b" data-rate="1.5">1.5x</button>
        <span class="sep"></span>
        <button class="b" data-act="subs" id="subsBtn">Legenda: não</button>
        <button class="b" data-act="fs">Tela cheia</button>
        <button class="b" data-act="next">Próximo ›</button>
        <button class="b" data-act="close">Voltar</button>
      </div>
    </div>
  </div>
</section>

<script>
const $ = s => document.querySelector(s);
const v = $('#v'), player = $('#player'), grid = $('#grid');
const store = {
  get(k, d) { try { const x = localStorage.getItem(k); return x === null ? d : JSON.parse(x); } catch { return d; } },
  set(k, x) { try { localStorage.setItem(k, JSON.stringify(x)); } catch {} },
};
const SUBS = [['off', 'não'], ['por', 'pt-br'], ['eng', 'inglês']];
let eps = [], cur = -1, idleTimer = 0, toastTimer = 0;
let rate = store.get('rate', 1), subs = store.get('subs', 'off');

const fmt = s => { s = Math.max(0, Math.floor(s || 0)); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; };
const prog = id => store.get('p:' + id, { t: 0, d: 0, done: false });

function renderGrid() {
  grid.innerHTML = '';
  eps.forEach((e, i) => {
    const p = prog(e.id);
    const b = document.createElement('button');
    b.className = 'card' + (p.done ? ' done' : '');
    b.innerHTML = `<span class="n">${e.n === 'Extra' ? 'Extra' : 'Episódio ' + e.n}</span><span class="t"></span>` +
      (p.d ? `<span class="bar" style="width:${p.done ? 100 : (100 * p.t / p.d).toFixed(1)}%"></span>` : '');
    b.querySelector('.t').textContent = e.title;
    b.onclick = () => openEp(i, true);
    grid.appendChild(b);
  });
}

function focusables() {
  const root = player.classList.contains('on') ? player : $('#home');
  return [...root.querySelectorAll('button')].filter(b => b.offsetParent !== null);
}

// D-pad spatial navigation: nearest focusable in the pressed direction.
function moveFocus(dir) {
  const list = focusables();
  const a = document.activeElement;
  if (!list.includes(a)) { list[0]?.focus(); return; }
  const r = a.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  let best = null, bestScore = Infinity;
  for (const b of list) {
    if (b === a) continue;
    const q = b.getBoundingClientRect(), x = q.left + q.width / 2, y = q.top + q.height / 2;
    const dx = x - cx, dy = y - cy;
    const main = { left: -dx, right: dx, up: -dy, down: dy }[dir];
    if (main <= 1) continue;
    const cross = dir === 'left' || dir === 'right' ? Math.abs(dy) : Math.abs(dx);
    const score = main + cross * 3;
    if (score < bestScore) { bestScore = score; best = b; }
  }
  if (best) { best.focus(); best.scrollIntoView({ block: 'nearest' }); }
}

function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 1200);
}

function setIdle(idle) {
  player.classList.toggle('idle', idle);
  liftCues();
}

// Lift cues above the controls while the OSD is visible.
function liftCues() {
  const line = player.classList.contains('idle') ? 'auto' : -6;
  for (const t of v.textTracks) for (const c of t.cues || []) c.line = line;
}

function wake() {
  if (player.classList.contains('idle')) setIdle(false);
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => { if (!v.paused) setIdle(true); }, 4000);
}

function goFullscreen() {
  const el = document.documentElement;
  if (!document.fullscreenElement && el.requestFullscreen) el.requestFullscreen().catch(() => {});
}

function setRate(r) {
  rate = r; store.set('rate', r);
  v.defaultPlaybackRate = r; v.playbackRate = r;
  document.querySelectorAll('[data-rate]').forEach(b => b.classList.toggle('sel', +b.dataset.rate === r));
}

function applySubs() {
  [...v.textTracks].forEach(t => { t.mode = t.language === subs ? 'showing' : 'hidden'; });
  $('#subsBtn').textContent = 'Legenda: ' + SUBS.find(s => s[0] === subs)[1];
}

function dropSubs() {
  for (const t of v.textTracks) t.mode = 'disabled';
  v.querySelectorAll('track').forEach(t => t.remove());
}

function openEp(i, fromGrid) {
  if (i < 0 || i >= eps.length) return;
  saveProgress();
  cur = i;
  const e = eps[i];
  if (fromGrid) { goFullscreen(); history.pushState({ player: 1 }, ''); }
  $('#pn').textContent = e.n === 'Extra' ? 'Extra' : 'Episódio ' + e.n;
  $('#pt').textContent = e.title;
  dropSubs();
  for (const [lang, label] of [['por', 'Português'], ['eng', 'English']]) {
    const tr = document.createElement('track');
    Object.assign(tr, { kind: 'subtitles', srclang: lang, label, src: `media/${e.id}.${lang}.vtt` });
    tr.addEventListener('load', liftCues);
    v.appendChild(tr);
  }
  v.src = `media/${e.id}.mp4`;
  const p = prog(e.id);
  v.addEventListener('loadedmetadata', () => {
    if (!p.done && p.t > 5 && p.t < v.duration - 10) { v.currentTime = p.t; toast('Continuando de ' + fmt(p.t)); }
    setRate(rate); applySubs();
  }, { once: true });
  player.classList.add('on');
  document.body.classList.add('playing');
  v.play().catch(() => {});
  wake();
  $('#playBtn').focus();
}

function closePlayer() {
  saveProgress();
  v.pause(); dropSubs(); v.removeAttribute('src'); v.load();
  player.classList.remove('on');
  document.body.classList.remove('playing');
  if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
  renderGrid();
  grid.children[Math.max(cur, 0)]?.focus();
}

function saveProgress(done) {
  if (cur < 0 || !v.duration) return;
  const id = eps[cur].id, old = prog(id);
  store.set('p:' + id, { t: v.currentTime, d: v.duration, done: done || old.done || v.currentTime > v.duration - 15 });
}

function seekBy(s) {
  v.currentTime = Math.min(Math.max(0, v.currentTime + s), (v.duration || 0) - 0.5);
  toast((s > 0 ? '+' : '') + s + 's  ' + fmt(v.currentTime));
}

function togglePlay() { v.paused ? v.play() : v.pause(); }

const actions = {
  back10: () => seekBy(-10),
  fwd10: () => seekBy(10),
  play: togglePlay,
  subs: () => {
    subs = SUBS[(SUBS.findIndex(s => s[0] === subs) + 1) % SUBS.length][0];
    store.set('subs', subs); applySubs();
  },
  fs: () => document.fullscreenElement ? document.exitFullscreen() : goFullscreen(),
  next: () => openEp(cur + 1),
  close: () => history.back(),
};

$('#ctrls').addEventListener('click', ev => {
  const b = ev.target.closest('button'); if (!b) return;
  if (b.dataset.rate) { setRate(+b.dataset.rate); toast(b.dataset.rate + 'x'); }
  else actions[b.dataset.act]?.();
  wake();
});

v.addEventListener('play', () => { $('#playBtn').textContent = '⏸ Pausar'; wake(); });
v.addEventListener('pause', () => { $('#playBtn').textContent = '▶ Tocar'; wake(); saveProgress(); });
let dragging = false;
function seekTo(ev) {
  const r = $('#track').getBoundingClientRect(), t = Math.min(Math.max(0, (ev.clientX - r.left) / r.width), 1) * (v.duration || 0);
  $('#fill').style.width = 100 * t / (v.duration || 1) + '%'; $('#cur').textContent = fmt(t);
  return t;
}
$('#track').addEventListener('pointerdown', ev => { dragging = true; $('#track').setPointerCapture(ev.pointerId); seekTo(ev); wake(); });
$('#track').addEventListener('pointermove', ev => { if (dragging) { seekTo(ev); wake(); } });
$('#track').addEventListener('pointerup', ev => { if (!dragging) return; dragging = false; v.currentTime = seekTo(ev); saveProgress(); });
$('#track').addEventListener('pointercancel', () => { dragging = false; });
v.addEventListener('timeupdate', () => {
  if (dragging) return;
  $('#cur').textContent = fmt(v.currentTime); $('#dur').textContent = fmt(v.duration);
  $('#fill').style.width = (v.duration ? 100 * v.currentTime / v.duration : 0) + '%';
});
setInterval(() => { if (!v.paused) saveProgress(); }, 5000);
v.addEventListener('ended', () => {
  saveProgress(true);
  if (cur + 1 < eps.length) { toast('Próximo episódio…'); setTimeout(() => openEp(cur + 1), 2500); }
});
player.addEventListener('mousemove', wake);
v.addEventListener('click', () => { togglePlay(); wake(); });

window.addEventListener('popstate', () => { if (player.classList.contains('on')) closePlayer(); });

document.addEventListener('keydown', ev => {
  const k = ev.key;
  const inPlayer = player.classList.contains('on');
  const dirs = { ArrowLeft: 'left', ArrowRight: 'right', ArrowUp: 'up', ArrowDown: 'down' };

  if (inPlayer) {
    const media = {
      MediaPlayPause: togglePlay, MediaPlay: () => v.play(), MediaPause: () => v.pause(),
      MediaFastForward: () => seekBy(30), MediaRewind: () => seekBy(-30),
      MediaTrackNext: actions.next, MediaTrackPrevious: () => openEp(cur - 1), ' ': togglePlay,
    };
    if (media[k]) { ev.preventDefault(); media[k](); wake(); return; }
    if (k === 'Escape' || k === 'Backspace' || k === 'GoBack' || k === 'BrowserBack') {
      ev.preventDefault(); history.back(); return;
    }
    // OSD hidden: left/right seek, OK toggles play, anything else just shows the OSD.
    if (player.classList.contains('idle')) {
      ev.preventDefault();
      if (k === 'ArrowLeft') seekBy(-10);
      else if (k === 'ArrowRight') seekBy(10);
      else if (k === 'Enter') togglePlay();
      wake();
      return;
    }
    wake();
  }
  if (dirs[k]) { ev.preventDefault(); moveFocus(dirs[k]); }
});

fetch('episodes.json').then(r => r.json()).then(list => {
  eps = list; renderGrid(); grid.children[0]?.focus();
});
</script>
</body>
</html>
